[package]
name = "jj-xet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Jujutsu (jj) with large files stored in Xet"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1.89"
bstr = "1.13.1"
clap = { version = "4", features = ["derive"] }
dirs = "7.0.0"
either = "1.16.0"
futures = "0.3.32"
gix = { version = "0.88.0", default-features = false }
globset = "0.4.20"
itertools = "0.15.0"
jj-cli = "=0.46.0"
jj-lib = "=0.46.0"
once_cell = "1.21.4"
pollster = "1.0.1"
prost = "0.14.3"
rayon = "1.12.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-util", "fs"] }
tracing = "0.1.44"
xet-client = "1.7.0"
xet-data = "1.7.0"
xet-runtime = "1.7.0"

[features]
default = ["watchman"]
# Mirrors jj's feature; the vendored working copy has watchman code paths.
watchman = ["jj-lib/watchman", "jj-cli/watchman"]

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
xet-client = { version = "1.7.0", features = ["simulation"] }
